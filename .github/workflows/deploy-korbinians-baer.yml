name: Deploy Korbinians Bär zu Hostinger

# Laedt das Spiel "Korbinians Baer" bei Aenderungen auf main per FTPS nach
# /anaesthesieprotokoll/korbinians-baer/ hoch.
# Erreichbar unter https://anaesthesieprotokoll.vaydena.de/korbinians-baer/
on:
  push:
    branches: [ main ]
    paths:
      - "korbinians-baer/**"
      - ".github/workflows/deploy-korbinians-baer.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-korbinian
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Secret pruefen
        id: guard
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::notice::FTP_PASSWORD fehlt noch - Deploy uebersprungen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Gleiches Verfahren wie deploy.yml: FTPS via curl, je Datei mehrere Anlaeufe.
      - name: Deploy via FTPS (curl)
        if: steps.guard.outputs.ready == 'true'
        working-directory: korbinians-baer
        env:
          FTPHOST: ftp.vaydena.de
          FTPUSER: u424339903.deploy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          upload() {
            f="$1"; attempt=1; max=5
            while [ "$attempt" -le "$max" ]; do
              echo "Lade $f hoch (Versuch $attempt/$max)..."
              if curl --ssl-reqd -k --ftp-create-dirs \
                   --connect-timeout 60 --max-time 300 \
                   --retry 3 --retry-delay 5 --retry-all-errors \
                   --fail --show-error --silent \
                   --user "$FTPUSER:$FTP_PASSWORD" \
                   -T "$f" "ftp://$FTPHOST/anaesthesieprotokoll/korbinians-baer/$f"; then
                echo "  OK: $f"; return 0
              fi
              echo "  Fehlversuch $attempt fuer $f"
              attempt=$((attempt+1)); sleep 15
            done
            echo "Aufgeben nach $max Versuchen: $f"; return 1
          }
          # Alle Spieldateien ausser README; sw.js zuletzt, damit der neue
          # Service Worker erst die fertigen Dateien vorfindet.
          find . -type f ! -name README.md ! -name sw.js | sed 's|^\./||' | sort > /tmp/dateien.txt
          echo sw.js >> /tmp/dateien.txt
          while read -r f; do upload "$f"; done < /tmp/dateien.txt
          echo "Alle Dateien hochgeladen."
